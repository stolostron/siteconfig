# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# siteconfig settings, layered on the org config in stolostron/coderabbit.
#
# inheritance: true keeps every org value this file does not set. Lists merge
# by key: an entry here with the same `path` (path_instructions) or `name`
# (custom_checks) replaces the org entry; all other org entries still apply.
# To see the merged result, comment `@coderabbitai configuration` on a PR.
#
# A PR from a fork is reviewed with the copy of this file on its base commit,
# so a change here reaches PRs opened or rebased after it merges. To try a
# change on one PR first, comment `@coderabbitai review --with-config`
# followed by the YAML in a fenced block (keep `inheritance: true` in it).
#
# Add a rule only when reviews miss the same thing on more than one PR, and
# write it so a violation can be seen in a diff.
inheritance: true

tone_instructions: "Be brief. Ask questions rather than give orders. No praise. Raise design, scope and test-value problems before line-level ones."

reviews:
  # The default pauses reviews after 5 reviewed commits, so on a long-running
  # PR the final head never gets reviewed. 0 turns the pause off. Every push
  # is then reviewed and counts toward the author's review rate limit.
  auto_review:
    auto_pause_after_reviewed_commits: 0

  high_level_summary_instructions: |
    Start with a table of added lines (approximate) split into: production
    Go, test Go, docs and samples, generated (bundle/, config/crd/,
    zz_generated, mocks).
    Then list anything this PR adds to the supported surface: API fields,
    operator config keys, labels, annotations, controllers, RBAC rules.
    Say "none" if there are none.
    Then name the docs/enhancements/ proposal this PR implements, or "none".
    Then a short summary of the behaviour change.

  merge_risk_instructions: |
    siteconfig is an operator that provisions, reinstalls and deletes
    clusters. ClusterInstance objects usually reach it from Git through
    ArgoCD.
    Higher risk: API type, CRD schema or CRD default changes; changes to what
    the webhook allows after provisioning or on reinstall; changes to the
    built-in templates in internal/templates/; new controllers or operator
    config keys; RBAC changes; writes to objects the ClusterInstance does not
    own; deletion, reinstall and backup/restore paths; more than 500 added
    lines of production Go.
    Lower risk: docs-only, test-only, dependency bumps with no code change.

  path_instructions:
    # From CodeRabbit's "Reduce review noise" guide.
    - path: "**/*"
      instructions: |
        - Ignore style and formatting. Linters run in CI.
        - Mention a repeated pattern once, at summary level, not once per file.

    # Replaces the org "**/*.go" entry. An entry with this path has to exist,
    # or the org one applies with its copyright-holder rule: every Go file
    # here carries the kubebuilder "Copyright YYYY." header, so that rule
    # fires on each new file. The org rules on error handling, crypto, size
    # bounds and log format are left out because golangci-lint enforces them
    # in CI (gosec, wrapcheck, errorlint, loggercheck).
    - path: "**/*.go"
      instructions: |
        golangci-lint runs in CI, so do not comment on what it reports.
        Check that Kubernetes API calls use the caller's context.Context and
        not context.Background() or context.TODO().

    # Added on top of the org controller entry (different glob, so both apply).
    - path: "{api,cmd,internal}/**/*.go"
      instructions: |
        Read the whole diff before commenting on lines. Then, as questions:
        - Is the same logic, rule or constant written in more than one place
          in this diff or already in the repo? Name the copies.
        - Does the PR add supported surface (API field, config key, label,
          annotation, controller)? For each, what reads it, and what would
          break without it?
        - Does the code write to objects the user authored? Those usually come
          from ArgoCD/GitOps, so ask how the write interacts with it.
        - Does it change how siteconfig writes, labels or deletes an object it
          renders (BareMetalHost, AgentClusterInstall, ClusterDeployment,
          ManagedCluster and so on)? Other operators write to those objects
          too. Ask what happens when the other controller acts first.
        - What changes for a ClusterInstance that is already provisioned when
          the operator is upgraded to this code? Look for new defaults, new
          validation that rejects a stored spec, and changed rendered output.
        - If a file in docs/enhancements/ covers this feature, does the code
          do what the proposal says? Name each difference.
        - Are there comments that only restate the next line of code (for
          example "// Check for duplicate names" above a duplicate check)?
          Raise it once for the whole PR with up to three examples, not per
          line. Leave godoc on exported identifiers and comments on API
          fields alone; the latter become CRD descriptions.

    # Added on top of the org "**/api/**/*.go" entry.
    - path: "api/v1alpha1/*_types.go"
      instructions: |
        For each spec field this PR adds or changes:
        - Can it change after the cluster is provisioned, and on reinstall?
          Is that decision made in validatePostProvisioningChanges
          (clusterinstance_validation.go) and covered by a test?
        - Does it have a +kubebuilder:default marker? On clusters provisioned
          before the upgrade, a new default shows up as a spec difference
          between Git and the stored object, and post-provisioning validation
          can reject the sync. Ask how those clusters are handled.

    # Replaces the org "**/*_test.go" entry. Drops the "every assertion needs a
    # message" rule (about 2% of assertions in this repo have one).
    - path: "**/*_test.go"
      instructions: |
        Keep: fake.Client for unit tests, static Ginkgo titles, explicit
        timeout and interval on Eventually/Consistently, cleanup of
        cluster-scoped resources.
        Judge each new test by what it would catch: which production change in
        this PR would make it fail? If none, or another test already catches
        the same thing, ask whether it is needed.
        Then look the other way: is there new behaviour that no test would
        notice being removed? Say which.
        If the PR adds a test suite, test directory or make test target, which
        CI job runs it (.tekton/, .github/workflows/, the Makefile ci-job
        target)? If none does, say so.

    # User docs. docs/enhancements/ is left out on purpose: proposals have a
    # required Test Plan section and get their own entry below.
    - path: "docs/{*.md,reinstallation/**/*.md}"
      instructions: |
        These files are user-facing reference.
        - Flag content that records how the change was developed or tested
          (dated results, investigation notes, test plans). It belongs in the
          PR description or Jira.
        - Flag statements that the code in this PR does not match.

    - path: "docs/enhancements/*.md"
      instructions: |
        This is a design proposal, reviewed before the code exists. Do not ask
        for implementation or tests in this PR, and do not comment on section
        structure (hack/enhancement-lint.sh checks it).
        Ask about:
        - Statements that contradict each other inside the proposal, or that
          contradict the current code or another file in docs/enhancements/.
        - Clusters that are already provisioned: what changes for them on
          upgrade, and on downgrade?
        - Objects that other operators also write (BareMetalHost and others):
          who wins, and in what order are they deleted?
        - Each new API field, config key, label or annotation: what reads it,
          and can an existing field or mechanism do the job?

  pre_merge_checks:
    custom_checks:
      # Replaces the org check of the same name. Same criteria, minus "every
      # assertion needs a failure message": about 2% of assertions in this
      # repo have one, and the org check flagged all five recent PRs that
      # added tests for it.
      - name: "Test Structure and Quality"
        mode: warning
        instructions: |
          Review Go test code for these quality requirements:

          1. Single responsibility: each test (It block or Test* function)
             should test one specific behavior. Flag tests that assert multiple
             unrelated behaviors.

          2. Setup and cleanup: tests should use BeforeEach/AfterEach (Ginkgo)
             or t.Cleanup for setup and cleanup. Flag tests that create
             cluster-scoped resources without cleanup.

          3. Timeouts on async operations: operations that interact with the
             cluster or wait for conditions must have explicit timeouts.
             Bad: Eventually(func() bool { ... }).Should(BeTrue())
             Good: Eventually(func() bool { ... }, 30*time.Second, 1*time.Second).Should(BeTrue())

          4. Unit test isolation: unit tests must use the controller-runtime
             fake.Client, not real K8s API servers. Flag any test that dials an
             external endpoint without a mock or fake.

          Do not fail this check because assertions have no failure message.

      # 500 is about the 95th percentile of merged PRs that touch Go in this
      # repo (8 of 115 were larger).
      - name: "PR size and scope"
        mode: warning
        instructions: |
          Count the lines this PR adds to production Go, using git diff
          --numstat between the base and the head of the PR.
          Production Go is every *.go file except: *_test.go, files under
          vendor/, test/, bundle/ or config/, and generated files
          (zz_generated*, *_generated.go).
          Pass if the count is 500 or less.
          Pass if the count is over 500 and the PR description explains why
          the change cannot be split.
          Otherwise fail. Report the count and propose a split into PRs that
          each build and pass tests on their own.

      - name: "Enhancement proposal first"
        mode: warning
        instructions: |
          CONTRIBUTING.md requires an enhancement proposal to be merged before
          the implementation PR.
          Applies when the PR adds, removes or renames a field in
          api/v1alpha1/*_types.go, adds a controller, or adds an operator
          config key (internal/controller/configuration/).
          Does not apply to bug fixes, refactors, docs or dependency updates.
          Pass if it does not apply.
          Pass if a file under docs/enhancements/ on the base branch describes
          the change, or the PR itself only adds that file.
          Fail if no such file exists, or if the PR adds API fields, config
          keys or controllers that the proposal does not mention. List each.
