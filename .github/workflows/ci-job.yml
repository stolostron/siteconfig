name: ci-job

on:
  pull_request:
    branches:
    - main
    # Skipped only when every changed file matches one of these patterns.
    paths-ignore:
    - 'docs/**'
    - '**.md'
    - '.tekton/**'
    - '.coderabbit.yaml'
    - '.markdownlint-cli2.yaml'
    - '.gitignore'
    - '**/OWNERS'
    - 'OWNERS'
    - 'OWNERS_ALIASES'
    - 'PROJECT'
    - 'renovate.json'
    - 'sonar-project.properties'

jobs:

  run-ci-checks:
    name: Run CI job
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source
      uses: actions/checkout@v3

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: './go.mod'

    - name: Run CI job
      run: make ci-job
